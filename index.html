<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a2e">
<title>名探偵・佐吉 〜ちゅ〜る狂騒曲〜</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game" aria-live="polite">
  <!-- 舞台 -->
  <div id="stage">
    <div id="bg"></div>
    <div id="chars"></div>
    <div id="fx"></div>
  </div>

  <!-- 捜査ハブ：上部バー -->
  <header id="hubbar" hidden>
    <div class="hub-ch" id="hub-ch"></div>
    <div class="hub-loc" id="hub-loc"></div>
    <button class="icon-btn" id="btn-goals" aria-label="捜査の目標">🎯</button>
    <button class="icon-btn" id="btn-menu-hub" aria-label="メニュー">☰</button>
  </header>
  <div id="goals" class="goals" hidden></div>

  <!-- 会話ウィンドウ -->
  <section id="dialog" hidden>
    <div id="nameplate"></div>
    <div id="text"></div>
    <div id="next-ind" aria-hidden="true">▼</div>
    <div class="dlg-tools">
      <button data-act="auto" id="btn-auto">オート</button>
      <button data-act="skip" id="btn-skip">スキップ</button>
      <button data-act="log">ログ</button>
      <button data-act="menu">メニュー</button>
    </div>
  </section>

  <!-- 選択肢 -->
  <section id="choices" hidden></section>

  <!-- コマンド（捜査ハブ） -->
  <nav id="commands" hidden></nav>

  <!-- 汎用パネル（シート） -->
  <section id="panel" hidden>
    <div class="panel-head"><h2 id="panel-title"></h2><button class="icon-btn" id="panel-close" aria-label="閉じる">✕</button></div>
    <div id="panel-body"></div>
  </section>

  <!-- 通知（証拠入手など） -->
  <div id="toasts"></div>

  <!-- 章タイトルカード -->
  <div id="card" hidden><div class="card-inner"><div id="card-title"></div><div id="card-sub"></div></div></div>

  <!-- タイトル画面 -->
  <section id="title" hidden>
    <div class="title-art" id="title-art"></div>
    <h1 class="logo"><span class="logo-small">名探偵</span><span class="logo-main">佐吉</span><span class="logo-sub">〜ちゅ〜る狂騒曲〜</span></h1>
    <div class="title-menu" id="title-menu"></div>
    <p class="title-note" id="title-note"></p>
  </section>
</div>

<noscript><p style="color:#fff;padding:2em">このゲームを遊ぶには JavaScript を有効にしてください。</p></noscript>

<!-- データ（シナリオ）→ コア → 表示 の順に読み込む。file:// で直接開いても動く。 -->
<script src="data/characters.js"></script>
<script src="data/evidence.js"></script>
<script src="data/notebook.js"></script>
<script src="data/locations.js"></script>
<script src="data/talks.js"></script>
<script src="data/scenes.js"></script>
<script src="data/endings.js"></script>
<script src="data/assets.js"></script>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
